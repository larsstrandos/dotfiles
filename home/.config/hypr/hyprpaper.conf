# hyprpaper rotates through every image in a folder. The images are not in
# this repo; see README "Wallpapers".
splash = false
ipc = true

# Every monitor: landscape set, new image every 10 minutes
wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/current/desktop
    fit_mode = cover
    timeout = 600
}

# thor: the rotated (portrait) ASUS gets the portrait set
wallpaper {
    monitor = desc:ASUSTek COMPUTER INC ASUS VG289Q1A 0x0001189D
    path = ~/Pictures/wallpapers/current/mobile
    fit_mode = cover
    timeout = 600
}
