# hyprpaper picks one random image from a folder at startup and keeps it.
# timeout is a year because 0 means "default", which rotates every 30s.
# The images are not in this repo; see README "Wallpapers".
splash = false
ipc = true

# Every monitor: landscape set
wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/current/desktop
    fit_mode = cover
    order = random
    timeout = 31536000
}

# thor: the rotated (portrait) ASUS gets the portrait set
wallpaper {
    monitor = desc:ASUSTek COMPUTER INC ASUS VG289Q1A 0x0001189D
    path = ~/Pictures/wallpapers/current/mobile
    fit_mode = cover
    order = random
    timeout = 31536000
}
