# macOS-style modifiers. Install with:
#   sudo pacman -S keyd
#   sudo install -Dm644 ~/.config/hypr/keyd-default.conf /etc/keyd/default.conf
#   sudo systemctl enable --now keyd
#
# Panic escape hatch if something goes wrong: press backspace+escape+enter
# together to terminate keyd and get your normal keyboard back.
# Debug what is actually being emitted with: sudo keyd monitor

[ids]
*

[main]
# Same mapping macOS itself applies to a PC keyboard:
# Windows key -> Command, Alt -> Option
leftmeta = layer(cmd)
leftalt  = layer(opt)

# cmd:M — keys NOT listed here still reach Hyprland as SUPER
[cmd:M]
c = C-c
v = C-v
x = C-x
z = C-z
a = C-a
s = C-s
f = C-f
t = C-t
w = C-w
n = C-n
p = C-p
r = C-r
left  = home
right = end
up    = C-home
down  = C-end
backspace = C-backspace

# opt:A — Option+arrows jump by word, like macOS
[opt:A]
left  = C-left
right = C-right
backspace = C-backspace
